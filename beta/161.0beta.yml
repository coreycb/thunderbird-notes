release:
  release_date: '2026-11-10'
  text: |
    **These notes apply to Thunderbird version 161 beta 1 released November 10, 2026.**

    **System Requirements:** [Details](/en-US/thunderbird/160.0beta/system-requirements/)

  import_system_requirements: 153.0beta

  groups:
    - ' '

notes:
  # New
  - note: OpenPGP Key Assistant source links have a Copy Link Location context menu
    tag: new
    bugs: [2083706]
  - note: Unread count badges are available on supported Linux taskbars
    tag: new
    bugs: [1551864]

  # Changed
  - note: Key lookup tries WKD before the Proton keyserver for Proton-hosted domains
    tag: changed
    bugs: [2083691]
  - note: Message filtering continues after an action fails without prompting
    tag: changed
    bugs: [2077589]
  - note: Non-critical folder errors appear as notifications instead of modal dialogs
    tag: changed
    bugs: [2057045]
  - note: OTR chat encryption is disabled by default for profiles that never used it
    tag: changed
    bugs: [1909445]

  # Fixed
  - note: Progress indicators could fail to update during folder operations
    tag: fixed
    bugs: [2077861]
  - note: The Subscribe dialog continued to show Please wait after loading
    tag: fixed
    bugs: [2085557]
  - note: The progress indicator could keep spinning after an Exchange sync ended
    tag: fixed
    bugs: [2085621]
  - note: Accessing offline IMAP messages could cause Thunderbird to crash
    tag: fixed
    bugs: [2088362]
  - note: Finding an unread message could loop endlessly in damaged threads
    tag: fixed
    bugs: [2088362]
  - note: The Quick Filter keyboard shortcut could stop working
    tag: fixed
    bugs: [1847432]
  - note: Compose commands failed when feed articles were displayed as web pages
    tag: fixed
    bugs: [2085467]
  - note: Shift+Space scrolled messages down when focus was in the message list
    tag: fixed
    bugs: [2084510]
  - note: Selecting a message in a thread summary did not scroll it into view
    tag: fixed
    bugs: [2085651]
